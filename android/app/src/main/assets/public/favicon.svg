<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="100%" stop-color="#06321f" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Background Circle (Deep Islamic Green) -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <rect width="112" height="112" x="4" y="4" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Crescent Moon -->
  <path d="M72 26 C60 26 50 36 50 48 C50 60 60 70 72 70 C75.5 70 78.8 69.2 81.7 67.7 C77.8 72.5 71.8 75.5 65 75.5 C52.8 75.5 43 65.6 43 53.5 C43 42.7 50.8 33.7 61.1 31.7 C64.5 31 68 31.2 71.3 32.1 C71.5 30.1 72 28 72 26 Z" fill="url(#goldGrad)" />

  <!-- 8-Point Star -->
  <polygon points="48,34 50,36 53,35 52,38 54,40 51,41 50,44 48,42 45,43 46,40 44,38 47,37" fill="#fef08a" />

  <!-- Wooden Stand (Rehal) -->
  <polygon points="44,80 76,80 72,84 48,84" fill="#854d0e" />
  <polygon points="46,84 54,95 58,95 52,84" fill="#a16207" />
  <polygon points="74,84 66,95 62,95 68,84" fill="#713f12" />

  <!-- Open Quran Book Pages -->
  <path d="M34,57 C34,57 46,60 59,57 L59,81 C46,84 34,81 34,81 Z" fill="#fffbeb" />
  <path d="M86,57 C86,57 74,60 61,57 L61,81 C74,84 86,81 86,81 Z" fill="#fef3c7" />

  <!-- Book Spine -->
  <rect x="59" y="56" width="2" height="26" fill="#d97706" />

  <!-- Lines of Ayahs on Pages -->
  <line x1="38" y1="63" x2="55" y2="63" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />
  <line x1="39" y1="68" x2="54" y2="68" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />
  <line x1="40" y1="73" x2="53" y2="73" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />

  <line x1="65" y1="63" x2="82" y2="63" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
  <line x1="66" y1="68" x2="81" y2="68" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
  <line x1="67" y1="73" x2="80" y2="73" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
</svg>
