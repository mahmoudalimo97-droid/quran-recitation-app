name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Generate Android icons and splash assets
        run: |
          npx @capacitor/assets generate --android || npx capacitor-assets generate --android || true

      - name: Build web application
        run: npm run build

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Configure Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
              sed -i '/<\/application>/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
            fi
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<\/application>/a \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            fi
            if ! grep -q "android.permission.MODIFY_AUDIO_SETTINGS" "$MANIFEST"; then
              sed -i '/<\/application>/a \    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
            fi
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
