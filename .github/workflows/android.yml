name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. Running npx cap add android..."
            npx cap add android
          else
            echo "Android directory already exists."
          fi

      - name: Configure Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Configuring permissions in $MANIFEST..."
            # Check and insert RECORD_AUDIO permission if not already present
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
              echo "Added RECORD_AUDIO permission."
            fi
            # Check and insert INTERNET permission if not already present
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
              echo "Added INTERNET permission."
            fi
            # Check and insert MODIFY_AUDIO_SETTINGS permission if not already present
            if ! grep -q "android.permission.MODIFY_AUDIO_SETTINGS" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
              echo "Added MODIFY_AUDIO_SETTINGS permission."
            fi
          else
            echo "Warning: $MANIFEST not found before sync."
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Re-verify permissions post-sync
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
            fi
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
