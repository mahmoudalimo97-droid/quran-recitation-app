name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (Capacitor 7 -> Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee gradle.log

      - name: Diagnostic output on Gradle failure
        if: failure()
        working-directory: android
        run: |
          if [ -f gradle.log ]; then
            echo "==================== GRADLE ERROR SUMMARY ===================="
            grep -E -i -C 3 "(What went wrong|error:|FAILURE)" gradle.log || tail -n 60 gradle.log
            echo "=============================================================="
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          body: "تحميل أحدث نسخة من تطبيق تسميع القرآن الكريم (app-debug.apk)"
          draft: false
          prerelease: false
          make_latest: "true"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
